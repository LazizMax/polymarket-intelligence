name: Verify cloud analytics foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/performance_analytics.py'
      - 'tests/test_performance_analytics.py'
      - 'sql/**'
      - 'supabase/functions/**'
      - 'web/**'
      - '.github/workflows/cloud-analytics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt pytest psycopg2-binary
      - name: Test analytics and current application
        run: |
          python -m compileall -q app cloud
          pytest -q tests cloud/tests
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck protected Supabase ingestion function
        run: |
          deno check supabase/functions/pi-ingest/index.ts supabase/functions/pi-ingest/rn1-trade-utils.ts supabase/functions/pi-ingest/rn1-activity-utils.ts supabase/functions/pi-ingest/arb-capture.ts supabase/functions/pi-dashboard/index.ts supabase/functions/pi-dashboard/arb-math.ts supabase/functions/pi-dashboard/arb-temporal.ts
          deno test supabase/functions/pi-ingest/roi-math_test.ts supabase/functions/pi-ingest/roi-sync_test.ts supabase/functions/pi-ingest/rn1-trade-utils_test.ts supabase/functions/pi-ingest/rn1-activity-utils_test.ts supabase/functions/pi-ingest/arb-capture_test.ts supabase/functions/pi-dashboard/arb-math_test.ts supabase/functions/pi-dashboard/arb-temporal_test.ts
      - name: Check embedded browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("web/index.html").read_text(encoding="utf-8")
          assert "<script>" in source and "</script>" in source
          code = source.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/pi-browser.js").write_text(code)
          PY
          node --check /tmp/pi-browser.js
          test -z "$(grep -E 'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_URL' web/index.html || true)"
      - name: Smoke-test Postgres schema and blocked anonymous permissions
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: pi_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg2

          con = psycopg2.connect("")
          with con:
              with con.cursor() as cur:
                  cur.execute("create role anon nologin; create role authenticated nologin; create role service_role nologin;")
                  cur.execute(Path("sql/001_cloud_private_schema.sql").read_text())
                  # The dashboard reads fields introduced by subsequent migrations.
                  for migration in ("002_pi_ingestion_wallet_idx.sql",
                                    "003_pi_observed_pnl_metrics.sql",
                                    "004_pi_pnl_concentration_metrics.sql",
                                    "012_closed_position_roi.sql",
                                    "014_pi_auto_roi_refresh.sql",
                                    "016_arb_temporal_snapshots.sql",
                                    "018_arb_event_slug_links.sql",
                                    "019_rn1_trade_pilot.sql",
                                    "021_rn1_activity_pilot.sql",
                                    "023_rn1_outcome_market_price_evidence.sql",
                                    "024_rn1_historical_price_points.sql",
                                    "025_rn1_fill_price_benchmark.sql"):
                      cur.execute(Path("sql", migration).read_text())
                  cur.execute(
                      """select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                      where n.nspname='pi' and c.relkind='r' and c.relrowsecurity"""
                  )
                  secured = cur.fetchone()[0]
                  assert secured == 22, f"Expected RLS on all 22 tables, got {secured}"
                  cur.execute("select has_schema_privilege('anon','pi','usage')")
                  assert cur.fetchone()[0] is False, "anon must not see private schema"
                  # Exercise the actual SQL embedded in the wallet endpoint, not
                  # a paraphrased copy. This caught a 42601 syntax error on 2026-11-14.
                  import re
                  wallet = "0x" + "a" * 40
                  cur.execute("insert into pi.wallets(wallet) values (%s)", (wallet,))
                  cur.execute(
                      "insert into pi.wallet_pnl_daily(wallet,day,source,economic_pnl_usdc,realized_pnl_usdc) "
                      "values (%s,current_date-interval '1 day','polymarket_v2_user_pnl',25,22)",
                      (wallet,)
                  )
                  source = Path("supabase/functions/pi-dashboard/index.ts").read_text()
                  for expression, params in (
                      (r"const info=await db\.unsafe\(`([\s\S]*?)`,\[address\]\);", (wallet,)),
                      (r"const series=await db\.unsafe\(`([\s\S]*?)`,\[address,days\]\);", (wallet,365))
                  ):
                      found = re.search(expression, source)
                      assert found, "Wallet query not found in Edge Function"
                      query = found.group(1).replace("$1", "%s").replace("$2", "%s")
                      cur.execute(query, params)
                      assert cur.fetchall(), "Wallet endpoint SQL returned no rows for fixture"
                  # Auto-adopt each newly tracked wallet even without browser actions.
                  cur.execute(
                      "insert into pi.roi_import_state(wallet,request_priority) "
                      "select wallet,false from pi.wallets on conflict(wallet) do nothing"
                  )
                  cur.execute("select sync_mode,exhausted from pi.roi_import_state where wallet=%s",(wallet,))
                  assert cur.fetchone()==("initial",False),"New wallet was not queued"
                  # Test SQL from the real API handler, not a handwritten approximation.
                  cur.execute("update pi.roi_import_state set exhausted=true,sync_mode='idle',last_complete_at=now() where wallet=%s", (wallet,))
                  cur.execute(
                      "insert into pi.closed_position_roi(wallet,token_id,generation,valid_cost,"
                      "estimated_entry_cost_usdc,realized_pnl_usdc,estimated_roi_pct,last_event_at)"
                      " values(%s,'1',1,true,40,10,25,now()),(%s,'2',1,true,100,-20,-20,now())",
                      (wallet,wallet)
                  )
                  for pattern,params in (
                      (r"const summaryRows=await db\.unsafe\(`([\s\S]*?)`,\[address,state\.generation\]\);", (wallet,1)),
                      (r"const rows=await db\.unsafe\(`([\s\S]*?)`,\[address,state\.generation,per,\(page-1\)\*per\]\);", (wallet,1,30,0))
                  ):
                      match=re.search(pattern,source)
                      assert match, "ROI SQL not found in published Edge Function"
                      query=re.sub(r"\$(\d+)",lambda m:"%s",match.group(1))
                      cur.execute(query,params)
                      result=cur.fetchall()
                      assert result,"ROI query returned no rows"
                      if "roi_total_weighted" in query:
                          assert abs(result[0][5] - (-1000/140)) < .00001,result[0]
                          assert abs(result[0][6] - 2.5) < .00001,result[0]
                      # Verify all real research API SQL against the protected schema.
                  strategy=source.split("async function rn1StrategyEvidence(){",1)[1].split("async function rn1ActivityResearch(){",1)[0]
                  queries=re.findall(r"await db\\.unsafe\\(`([\\s\\S]*?)`,\\[RN1\\]\\)",strategy)
                  assert len(queries)==5, f"Expected 5 RN1 strategy SQL queries; found {len(queries)}"
                  for query in queries:
                      cur.execute(query.replace("$1","%s"),(wallet,))
                      cur.fetchall()
          con.close()
          PY
