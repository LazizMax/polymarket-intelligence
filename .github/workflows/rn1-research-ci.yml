name: RN1 research smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pi-rn1-independent-price/**'
      - 'supabase/functions/pi-rn1-replay/**'
      - 'supabase/functions/pi-dashboard/**'
      - 'web/index.html'
      - 'supabase/functions/pi-dashboard-dedicated/**'
      - 'supabase/functions/pi-rn1-official-pnl/**'
      - 'tests/test_rn1_*'
      - '.github/workflows/rn1-research-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/pi-rn1-replay/**'
      - 'supabase/functions/pi-dashboard/**'
      - 'web/index.html'
      - 'sql/04*_rn1_*'
      - 'tests/test_rn1_*'
      - '.github/workflows/rn1-research-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rn1-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test runner
        run: python -m pip install pytest
      - name: Verify RN1 source contracts and evidence caveats
        run: |
          python -m pytest -q \
            tests/test_rn1_full_archive.py \
            tests/test_rn1_independent_prices.py \
            tests/test_rn1_maker_role_audit.py \
            tests/test_rn1_pretrade_inventory.py \
            tests/test_rn1_live_quote_probe.py \
            tests/test_rn1_strategy_evidence.py \
            tests/test_rn1_strategy_verdict.py \
            tests/test_rn1_trigger_dashboard.py \
            tests/test_rn1_sports_event_alignment.py \
            tests/test_rn1_sports_robustness.py \
            tests/test_rn1_sizing_forensics.py \
            tests/test_rn1_sizing_market_validation.py \
            tests/test_rn1_exposure_forensics.py \
            tests/test_rn1_engine_forensics.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real RN1 engine on synthetic event-held-out fixtures
        run: node --experimental-strip-types tests/rn1_engine_fixture_test.mjs

      - name: Verify frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text()
          assert html.count('<script>') == 1
          Path('/tmp/pi_frontend.js').write_text(html.split('<script>', 1)[1].split('</script>', 1)[0])
          PY
          node --check /tmp/pi_frontend.js
