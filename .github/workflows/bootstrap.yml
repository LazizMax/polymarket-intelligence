name: Bootstrap source and publish V2.0

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/polymarket-source.b64'

permissions:
  contents: write

concurrency:
  group: polymarket-release
  cancel-in-progress: false

jobs:
  import-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate and unpack V2.0 code from signed-off source bundle
        run: python scripts/import_source_bundle.py bootstrap/polymarket-source.b64

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pytest

      - name: Compile and test imported application
        run: |
          python -m compileall -q app
          pytest -q tests

      - name: Determine version
        id: version
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("app/version.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version not published already
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Version $TAG is already published"
            exit 1
          fi

      - name: Build updater-compatible release
        run: python scripts/package_release.py

      - name: Commit real source and update manifest
        run: |
          cp dist/latest.json latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests installer latest.json
          git rm -f bootstrap/polymarket-source.b64
          git commit -m "feat: publish Polymarket Intelligence V2.0 source"
          git push

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/polymarket-code.zip \
            --target "$(git rev-parse HEAD)" \
            --title "Polymarket Intelligence $TAG" \
            --notes "Version 2.0.0 : interface simplifiée, métriques de couverture et collecte parallèle. Mise à jour du code uniquement ; données locales conservées."
